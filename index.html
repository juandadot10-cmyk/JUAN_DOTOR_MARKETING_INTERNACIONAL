let lang = "fr";
try { lang = localStorage.getItem("lang") || "fr"; } catch (e) {}
const carrito = {};
const $ = id => document.getElementById(id);
const eur = n => new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "es-ES", { style: "currency", currency: "EUR" }).format(n);

let temporizador;
function avisar(txt) {
  $("mensaje").textContent = txt;
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { $("mensaje").textContent = ""; }, 3500);
}

// Si una foto no carga, se muestra la masa dibujada con CSS
function fallo(img) {
  const sig = (img.dataset.alt || "").split(" ").filter(Boolean);
  if (sig.length) { img.dataset.alt = sig.slice(1).join(" "); img.src = sig[0]; return; }
  if (!img.dataset.f) { img.hidden = true; return; }
  const s = document.createElement("span");
  s.className = "masa masa--" + img.dataset.f;
  s.style.setProperty("--c2", img.dataset.c);
  img.replaceWith(s);
}

function pintarCatalogo() {
  $("catalogo").innerHTML = productos.map(p => {
    return `<article class="card">
      <div class="card__f">${p.best ? `<span class="pill">${T[lang].best}</span>` : ""}
        <img referrerpolicy="no-referrer" src="${p.img[0]}" data-alt="${p.img.slice(1).join(' ')}" alt="${p.n[lang]}" width="400" height="300" loading="lazy" decoding="async"
          data-f="${p.f}" data-c="${p.c}" onerror="fallo(this)"></div>
      <div class="card__b"><h3>${p.n[lang]}</h3><p>${p.d[lang]}</p>
        <div class="card__p"><strong>${eur(p.precio)}</strong>
        <button type="button" class="b" data-agregar="${p.id}">${T[lang].add}</button></div></div></article>`;
  }).join("");
}

function pintarCarrito() {
  let total = 0, cantidad = 0;
  $("lista-carrito").innerHTML = "";
  productos.forEach(p => {
    const c = carrito[p.id];
    if (!c) return;
    total += p.precio * c; cantidad += c;
    $("lista-carrito").insertAdjacentHTML("beforeend", `<li class="item">
      <span>${p.n[lang]}</span><span class="item__p">${eur(p.precio * c)}</span>
      <span class="q"><button type="button" data-menos="${p.id}" aria-label="−">−</button><span>${c}</span><button type="button" data-mas="${p.id}" aria-label="+">+</button></span></li>`);
  });
  $("vacio").hidden = cantidad > 0;
  $("total").textContent = eur(total);
  $("contador").textContent = cantidad;
  $("contador").title = cantidad + " " + T[lang].unit;
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T[l][el.dataset.i]; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  pintarCatalogo(); pintarCarrito();
}

const shell = $("shell");
const abrir = () => { shell.classList.add("open"); $("cerrar").focus(); };
const cerrar = () => shell.classList.remove("open");
$("abrir").addEventListener("click", abrir);
$("cerrar").addEventListener("click", cerrar);
$("velo").addEventListener("click", cerrar);
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

$("burger").addEventListener("click", () => {
  const on = $("nav").classList.toggle("on");
  $("burger").setAttribute("aria-expanded", on);
});
$("nav").addEventListener("click", e => { if (e.target.tagName === "A") { $("nav").classList.remove("on"); $("burger").setAttribute("aria-expanded", "false"); } });

document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  const d = t.dataset;
  if (d.lang) setLang(d.lang);
  else if (d.agregar || d.mas) { const id = d.agregar || d.mas; carrito[id] = (carrito[id] || 0) + 1; pintarCarrito(); if (d.agregar) avisar("✓ " + productos.find(p => p.id == id).n[lang]); }
  else if (d.menos) { carrito[d.menos]--; if (carrito[d.menos] <= 0) delete carrito[d.menos]; pintarCarrito(); }
  else if (d.pol) { e.preventDefault(); $("dlg-t").textContent = T[lang]["p" + d.pol]; $("dlg-p").textContent = T[lang]["x" + d.pol]; $("dlg").showModal(); }
});
$("dlg-x").addEventListener("click", () => $("dlg").close());

$("vaciar").addEventListener("click", () => {
  if (!Object.keys(carrito).length) { avisar(T[lang].m0); return; }
  Object.keys(carrito).forEach(id => delete carrito[id]);
  pintarCarrito(); avisar(T[lang].m1);
});
$("finalizar").addEventListener("click", () => {
  if (!Object.keys(carrito).length) { avisar(T[lang].m2); return; }
  alert(T[lang].ok + $("total").textContent + T[lang].ok2);
  Object.keys(carrito).forEach(id => delete carrito[id]);
  pintarCarrito(); cerrar();
});

setLang(lang);
</script>
